name: CI

on:
  pull_request:
  push:
    branches:
      - "**"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org/"
      - name: Install dependencies
        run: npm install
      - name: Run tests
        run: npm test
      - name: Build the package
        run: npm run build
      - name: Smoke test the binary
        run: npx wgctl

  release:
    name: Release
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs:
      - test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Lets npm CLI mint an OIDC token and publish via Trusted Publishing
      # — no NPM_TOKEN needed on the wire. It only takes effect once the
      # wgctl package is configured on npmjs.com (Package settings ->
      # Trusted Publisher -> GitHub Actions, repo AlexanderSlaa/wgctl,
      # workflow ci.yml) — a one-time step done on npmjs.com, not here.
      # Until/unless that's set, or if npm ever can't complete the OIDC
      # exchange, npm CLI falls back to NODE_AUTH_TOKEN below
      # automatically — both stay configured so neither path breaks
      # the other.
      id-token: write
    outputs:
      new-release-published: ${{ steps.semantic-release.outputs.new_release_published }}
      new-release-version: ${{ steps.semantic-release.outputs.new_release_version }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org/"
      - name: Update npm
        # Trusted Publishing needs npm CLI >= 11.5.1; don't rely on
        # whatever version happens to ship with the Node release above.
        run: npm install -g npm@latest
      - name: Install dependencies
        run: npm install
      - name: Restore tracked files
        run: git restore .
      - name: Build the package
        run: npm run build
      - name: Smoke test the binary
        run: npx wgctl
      - name: Run semantic-release
        id: semantic-release
        uses: cycjimmy/semantic-release-action@v4
        with:
          extra_plugins: |
            @semantic-release/changelog
            @semantic-release/git

  docker:
    name: Publish Docker image
    needs:
      - release
    if: needs.release.outputs.new-release-published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ needs.release.outputs.new-release-version }}
            type=raw,value=latest
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
